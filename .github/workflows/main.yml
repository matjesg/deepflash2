name: CI
on: [push, pull_request]
jobs:
  # Verify the package installs and its core API works on the modern stack
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the library
      run: pip install -e .
    - name: Import + model forward-pass smoke test
      run: |
        python -c "import deepflash2.all; print('import OK')"
        python - <<'PY'
        import torch
        from deepflash2.models import create_smp_model
        x = torch.randn(1, 1, 128, 128)
        for arch in ['Unet', 'UnetPlusPlus', 'FPN', 'DeepLabV3Plus']:
            m = create_smp_model(arch, encoder_name='resnet18', encoder_weights=None, in_channels=1, classes=2).eval()
            with torch.no_grad(): out = m(x)
            assert tuple(out.shape) == (1, 2, 128, 128), (arch, out.shape)
        m = create_smp_model('Unet', encoder_name='tu-convnext_tiny', encoder_weights=None, in_channels=1, classes=2).eval()
        with torch.no_grad(): assert tuple(m(x).shape) == (1, 2, 128, 128)
        print('smoke OK')
        PY

  # Verify notebooks and generated library are in sync (nbdev v1 tooling runs on the legacy stack only)
  nbdev-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install nbdev (v1)
      run: pip install "nbdev<2"
    - name: Check notebooks are cleaned
      run: |
        nbdev_read_nbs
        nbdev_clean_nbs --fname "nbs/*.ipynb"
        if [ -n "$(git status -uno -s)" ]; then echo "!!! Detected unstripped notebooks; run nbdev_install_git_hooks"; git status -s; false; fi
    - name: Check notebooks match the library
      run: |
        if [ -n "$(nbdev_diff_nbs)" ]; then echo "!!! Notebooks and library are out of sync"; nbdev_diff_nbs; false; fi
